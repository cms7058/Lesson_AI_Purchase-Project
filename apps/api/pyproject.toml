[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-assist-teaching-api"
version = "0.1.0"
description = "AI-assisted project and procurement teaching platform API"
requires-python = ">=3.11"
dependencies = [
  "scipy>=1.14,<2",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "celery>=5.4,<6",
  "httpx>=0.27,<1",
  "python-docx>=1.2,<2",
  "docxtpl>=0.20,<1",
  "pypdf>=5,<7",
  "reportlab>=5,<6",
  "python-multipart>=0.0.20,<1",
  "Pillow>=11,<13"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.ignore = ["B008"]

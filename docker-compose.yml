name: ai-assist-teaching

x-api: &api
  image: ai-assist-teaching-api:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment: &api-environment
    APP_ENV: production
    APP_NAME: AI助力
    DATABASE_URL: postgresql+psycopg://aiassist:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@postgres:5432/ai_assist
    WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:8080}
    AUTO_CREATE_SCHEMA: "false"
    LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    AI_ASSIST_SECRET_KEY: ${AI_ASSIST_SECRET_KEY:-}
    MINERU_BASE_URL: ${MINERU_BASE_URL:-}
    MINERU_API_KEY: ${MINERU_API_KEY:-}
    MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
    MINERU_TIMEOUT_SECONDS: ${MINERU_TIMEOUT_SECONDS:-120}
  volumes:
    - app_data:/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt:
    - "no-new-privileges:true"
  cap_drop: [ALL]
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_assist
      POSTGRES_USER: aiassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aiassist -d ai_assist"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db-init:
    <<: *api
    environment:
      <<: *api-environment
      AUTO_CREATE_SCHEMA: "true"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    command: [python, /opt/ai-assist/bootstrap.py]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *api
    depends_on:
      db-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  project-worker:
    <<: *api
    command: [python, -m, app.project_notification_worker]
    depends_on:
      db-init: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    image: ai-assist-teaching-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data:
  app_data:
